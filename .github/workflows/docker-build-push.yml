name: Build & Push Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Phase 1: build, scan and gate every variant, pushing each only by digest (no tags yet).
  # A failure in any leg — build error or a Trivy gate hit — leaves that variant untagged and,
  # because `promote` needs this whole job to succeed, blocks tag promotion for ALL variants.
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        variant: [base, native, android, chrome, full]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the one variant, push it by digest (no tag yet), and attach SBOM + provenance.
      - name: Build and push by digest
        id: build
        env:
          VARIANT: ${{ matrix.variant }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker buildx bake "$VARIANT" \
            --set "*.tags=" \
            --set "*.output=type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --set "*.attest=type=provenance,mode=max" \
            --set "*.attest=type=sbom" \
            --set "*.cache-from=type=gha,scope=${VARIANT}" \
            --set "*.cache-to=type=gha,mode=max,scope=${VARIANT}" \
            --metadata-file metadata.json
          digest="$(jq -r --arg v "$VARIANT" '.[$v]["containerimage.digest"]' metadata.json)"
          test -n "$digest" && test "$digest" != "null"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}

      # Gate: a fixable CRITICAL/HIGH fails the job, so tags are never promoted onto it.
      # Bundled third-party toolchains (the Android SDK's own lint jars, the Gradle and Rust
      # distributions) are excluded from the gate — those CVEs are upstream's to fix, not
      # patchable here, and the full SARIF scan above still reports them to code scanning.
      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: '/opt/gradle,/sdk,/usr/local/cargo,/usr/local/rustup'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.ref }}
          format: cyclonedx
          output: sbom-${{ matrix.variant }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.variant }}
          path: sbom-${{ matrix.variant }}.cdx.json
          retention-days: 90

      # Hand the vetted digest to the promote job. Nothing here is tagged yet.
      - name: Export digest
        env:
          VARIANT: ${{ matrix.variant }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${VARIANT}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.variant }}
          path: digests/${{ matrix.variant }}
          retention-days: 1
          if-no-files-found: error

  # Phase 2: runs only if EVERY variant in `build` succeeded (a failed leg skips this job, so no
  # variant is published). Promotes the user-facing tags and signs each published digest.
  promote:
    name: Promote tags
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"                       # strip a leading v
          majorminor="$(echo "$version" | cut -d. -f1-2)"
          {
            echo "image=${REGISTRY}/${IMAGE_NAME}"
            echo "version=${version}"
            echo "majorminor=${majorminor}"
          } >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Promote tags for every variant, then sign the digest (keyless). The plain, prefix-less
      # tags belong to `full`; every other variant gets its `<variant>-` prefix.
      - name: Promote tags and sign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          MAJORMINOR: ${{ steps.meta.outputs.majorminor }}
        run: |
          set -euo pipefail
          for f in digests/*; do
            variant="$(basename "$f")"
            digest="$(cat "$f")"
            if [ "$variant" = "full" ]; then prefix=""; else prefix="${variant}-"; fi
            ref="${IMAGE}@${digest}"
            docker buildx imagetools create \
              --tag "${IMAGE}:${prefix}${VERSION}" \
              --tag "${IMAGE}:${prefix}${MAJORMINOR}" \
              --tag "${IMAGE}:${prefix}latest" \
              "$ref"
            cosign sign --yes "$ref"
          done
